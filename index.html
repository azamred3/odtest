<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1621">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="منصة عودة للعقار — عقارات مختارة بعناية">
    <title>عودة للعقار — عقارات مختارة بعناية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-top">
        <div class="logo-container" id="home-logo-btn" role="button" tabindex="0" aria-label="الرئيسية">
            <div class="logo-mark"><i class="fas fa-home"></i></div>
            <div class="logo-text">
                <span class="logo-title">عودة للعقار</span>
                <span class="logo-sub">عقارات مختارة بعناية</span>
            </div>
        </div>
        <div class="user-actions">
            <button class="icon-btn" id="favorites-btn" aria-label="المفضلة" title="المفضلة">
                <i class="fas fa-heart"></i>
                <span class="notif-badge" id="fav-count" hidden>0</span>
            </button>
            <a href="log.html">
                <button class="icon-btn" aria-label="حسابي"><i class="fas fa-user"></i></button>
            </a>
        </div>
    </div>

    <div class="header-bottom">
        <div class="search-container">
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="search-input"
                       placeholder="ابحث عن عقار، منطقة، تصنيف..." autocomplete="off">
                <button class="search-clear-btn" id="search-clear" aria-label="مسح"><i class="fas fa-times"></i></button>
            </div>
            <div class="search-suggestions" id="search-suggestions"></div>
        </div>
    </div>
</header>

<!-- شريط الترحيب -->
<div class="welcome-bar" id="welcome-bar" hidden>
    <div class="welcome-inner">
        <span class="welcome-emoji">👋</span>
        <span class="welcome-text">مرحباً <b id="welcome-name">بك</b></span>
        <button class="welcome-close" id="welcome-close" aria-label="إغلاق">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<!-- QUICK FILTER CHIPS -->
<div class="quick-filters-bar">
    <div class="quick-filters-scroll" id="filter-chips"></div>
</div>

<!-- TOOLBAR -->
<div class="results-toolbar">
    <div class="results-info">
        <span class="results-count" id="results-count">0 عقار</span>
    </div>
    <div class="toolbar-actions">
        <div class="sort-dropdown">
            <button class="toolbar-btn" id="sort-btn">
                <i class="fas fa-sort"></i>
                <span id="sort-label">الأحدث</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="sort-menu" id="sort-menu">
                <button data-sort="newest" class="active">الأحدث</button>
                <button data-sort="price-asc">السعر: الأقل أولاً</button>
                <button data-sort="price-desc">السعر: الأعلى أولاً</button>
                <button data-sort="area-asc">المساحة: الأصغر</button>
                <button data-sort="area-desc">المساحة: الأكبر</button>
            </div>
        </div>
        <button class="toolbar-btn filter-toggle-btn" id="filter-toggle-btn">
            <i class="fas fa-sliders-h"></i>
            <span>فلترة</span>
            <span class="active-filters-count" id="active-filters-count" hidden>0</span>
        </button>
        <div class="view-toggle">
            <button class="view-btn active" data-view="grid" title="شبكة"><i class="fas fa-grip"></i></button>
            <button class="view-btn" data-view="map" title="خريطة"><i class="fas fa-map"></i></button>
        </div>
    </div>
</div>

<!-- MAIN -->
<main class="main-content">
    <div class="properties-container" id="properties-container"></div>
    <div id="properties-map" class="properties-map" style="display:none"></div>
</main>

<!-- FLOATING COMPARE BAR -->
<div class="compare-bar" id="compare-bar" hidden>
    <div class="compare-info">
        <div class="compare-thumbs" id="compare-thumbs"></div>
        <span class="compare-label">اختر حتى 3 للمقارنة</span>
    </div>
    <div class="compare-actions">
        <button class="btn btn-primary" id="compare-open-btn"><i class="fas fa-balance-scale"></i> مقارنة</button>
        <button class="btn btn-outline" id="compare-clear-btn"><i class="fas fa-times"></i></button>
    </div>
</div>

<!-- FILTERS BOTTOM SHEET -->
<div class="filter-sheet-backdrop" id="filter-sheet-backdrop"></div>
<div class="filter-sheet" id="filter-sheet">
    <div class="filter-sheet-handle"></div>
    <div class="filter-sheet-header">
        <h3>فلترة العقارات</h3>
        <button class="close-modal" id="filter-sheet-close"><i class="fas fa-times"></i></button>
    </div>
    <div class="filter-sheet-body">
        <div class="filter-group">
            <label>التصنيف</label>
            <div class="filter-chips-grid" id="filter-categories"></div>
        </div>
        <div class="filter-group">
            <label>نوع العملية</label>
            <div class="filter-chips-grid" id="filter-transactions">
                <button class="chip-option" data-val="للبيع">للبيع</button>
                <button class="chip-option" data-val="للإيجار">للإيجار</button>
            </div>
        </div>
        <div class="filter-group">
            <label>نطاق السعر (ر.س)</label>
            <div class="range-row">
                <input type="number" id="filter-min-price" placeholder="من" inputmode="numeric">
                <input type="number" id="filter-max-price" placeholder="إلى" inputmode="numeric">
            </div>
        </div>
        <div class="filter-group">
            <label>نطاق المساحة (م²)</label>
            <div class="range-row">
                <input type="number" id="filter-min-area" placeholder="من" inputmode="numeric">
                <input type="number" id="filter-max-area" placeholder="إلى" inputmode="numeric">
            </div>
        </div>
    </div>
    <div class="filter-sheet-footer">
        <button class="btn btn-outline" id="filter-reset-btn">إعادة تعيين</button>
        <button class="btn btn-primary" id="filter-apply-btn"><i class="fas fa-check"></i> تطبيق</button>
    </div>
</div>

<!-- PREVIEW OVERLAY -->
<div class="property-preview-overlay" id="preview-overlay">
    <div class="property-preview">
        <div class="preview-header">
            <button class="close-preview" id="preview-close"><i class="fas fa-chevron-down"></i></button>
            <h2 class="preview-title">تفاصيل العقار</h2>
            <div class="preview-header-actions">
                <button class="preview-action-btn" id="preview-compare-btn"><i class="fas fa-balance-scale"></i></button>
                <button class="preview-action-btn" id="preview-share-btn"><i class="fas fa-share-alt"></i></button>
                <button class="preview-action-btn" id="preview-favorite-btn"><i class="far fa-heart"></i></button>
            </div>
        </div>
        <div class="preview-content"></div>
    </div>
</div>

<!-- FAVORITES DRAWER -->
<div class="drawer-backdrop" id="fav-backdrop"></div>
<div class="side-drawer" id="favorites-drawer">
    <div class="drawer-header">
        <h3><i class="fas fa-heart" style="color:#F87171"></i> المفضلة</h3>
        <button class="close-modal" id="favorites-close"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="favorites-body"></div>
</div>

<!-- COMPARE MODAL -->
<div class="compare-modal" id="compare-modal">
    <div class="compare-modal-content">
        <div class="compare-modal-header">
            <h3>مقارنة العقارات</h3>
            <button class="close-modal" id="compare-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="compare-grid" id="compare-grid"></div>
    </div>
</div>

<!-- INQUIRY MODAL -->
<div class="inquiry-modal" id="inquiry-modal">
    <div class="inquiry-modal-content">
        <div class="inquiry-modal-header">
            <h3><i class="fas fa-paper-plane" style="color:var(--accent-bright)"></i> تواصل معنا</h3>
            <button class="close-modal" id="inquiry-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="inquiry-modal-body">
            <p class="inquiry-property-title" id="inquiry-property-title"></p>
            <div class="form-group">
                <label for="inquiry-name">الاسم *</label>
                <input type="text" id="inquiry-name" placeholder="اسمك الكريم" maxlength="50">
            </div>
            <div class="form-group">
                <label for="inquiry-phone">الجوال *</label>
                <input type="tel" id="inquiry-phone" placeholder="05xxxxxxxx" dir="ltr" maxlength="15">
            </div>
            <div class="form-group">
                <label for="inquiry-message">رسالتك (اختياري)</label>
                <textarea id="inquiry-message" rows="3" placeholder="أنا مهتم بهذا العقار..."></textarea>
            </div>
        </div>
        <div class="inquiry-modal-footer">
            <button class="btn btn-outline" id="inquiry-cancel">إلغاء</button>
            <button class="btn btn-primary" id="inquiry-submit"><i class="fab fa-whatsapp"></i> إرسال عبر واتساب</button>
        </div>
    </div>
</div>

<!-- SHARE MODAL -->
<div class="share-modal" id="share-modal">
    <div class="share-content">
        <div class="share-header">
            <h3>مشاركة العقار</h3>
            <button class="close-share" id="share-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="share-options">
            <button class="share-option whatsapp-share" data-type="whatsapp"><i class="fab fa-whatsapp"></i><span>واتساب</span></button>
            <button class="share-option telegram-share" data-type="telegram"><i class="fab fa-telegram"></i><span>تيليجرام</span></button>
            <button class="share-option link-share" data-type="link"><i class="fas fa-link"></i><span>نسخ الرابط</span></button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="app-toast" id="app-toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
